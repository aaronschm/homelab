# Application-specific NetworkPolicy allow rules.
# These supplement the default-deny policies in default-deny.yaml.
# Each app gets egress to its backing services (postgres, redis, minio, etc.)
# and inter-pod rules within the same namespace.

# ── postgresql ──────────────────────────────────────────────────────────────
# Allow all app namespaces to reach PostgreSQL (port 5432).
# We allow from any namespace because multiple apps share this DB.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-apps
  namespace: postgresql
spec:
  podSelector:
    matchLabels:
      app: postgresql
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - port: 5432

# ── minio ────────────────────────────────────────────────────────────────────
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-apps
  namespace: minio
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - port: 9000
        - port: 9001

# ── owncloud ─────────────────────────────────────────────────────────────────
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-owncloud-egress
  namespace: owncloud
spec:
  podSelector:
    matchLabels:
      app: owncloud
  policyTypes: [Egress]
  egress:
    - ports: [{port: 5432}]   # PostgreSQL
    - ports: [{port: 6379}]   # Redis
    - ports: [{port: 9000}]   # MinIO S3
---
# Redis sidecar in same namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-from-owncloud
  namespace: owncloud
spec:
  podSelector:
    matchLabels:
      app: owncloud-redis
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: owncloud

# ── immich ────────────────────────────────────────────────────────────────────
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-immich-egress
  namespace: immich
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - ports: [{port: 5432}]   # Immich own PostgreSQL
    - ports: [{port: 6379}]   # Redis
    - ports: [{port: 9000}]   # MinIO S3
---
# Internal Immich service mesh (server → ML, ML → server)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-immich-internal
  namespace: immich
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: immich
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: immich

# ── synapse ───────────────────────────────────────────────────────────────────
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-synapse-egress
  namespace: synapse
spec:
  podSelector:
    matchLabels:
      app: synapse
  policyTypes: [Egress]
  egress:
    - ports: [{port: 5432}]   # PostgreSQL
    # Federation egress to HTTPS (443) — restricted to EU IPs at Traefik level.
    - ports: [{port: 443}, {port: 8448}]

# ── vaultwarden ───────────────────────────────────────────────────────────────
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vaultwarden-egress
  namespace: vaultwarden
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    # Vaultwarden uses an embedded SQLite (longhorn PVC) — no DB egress needed.
    # Allow SMTP for email notifications if configured.
    - ports: [{port: 587}, {port: 465}]
