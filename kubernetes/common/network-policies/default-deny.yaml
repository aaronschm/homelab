# Default-deny NetworkPolicies for all application namespaces.
# Cilium (policyEnforcementMode: default) enforces these at the eBPF level.
# Add namespace-specific allow rules alongside each app's manifest.

# ── owncloud ───────────────────────────────────────────────────────────────────
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: owncloud
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Pods need DNS to resolve service names.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: owncloud
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# Allow Traefik (ingress controller) to reach pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-traefik
  namespace: owncloud
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik

