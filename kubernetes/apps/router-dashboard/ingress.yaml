apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: router-dashboard
  namespace: router-dashboard
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: authentik-forward-auth@kubernetescrd
spec:
  tls:
    - hosts:
        - router.isarcloud.eu
      secretName: router-dashboard-tls
  rules:
    - host: router.isarcloud.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: router-dashboard
                port:
                  number: 80
          # /api is handled by nginx inside the Pod (proxied to localhost:4000).
          # Port 4000 is NOT exposed here — all external traffic goes through
          # port 80 and therefore through Authentik forward-auth.
