apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: router-dashboard
  namespace: router-dashboard
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: authentik-forward-auth@kubernetescrd
spec:
  rules:
    - host: router.homelab.local # Adjust to your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: router-dashboard
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: router-dashboard
                port:
                  number: 4000
