apiVersion: v1
kind: Service
metadata:
  name: router-dashboard
  namespace: router-dashboard
spec:
  selector:
    app: router-dashboard
  ports:
    - name: frontend
      port: 80
      targetPort: 80
    # Port 4000 (backend) is intentionally NOT exposed as a Service port.
    # API traffic enters only via the nginx proxy on port 80, which enforces
    # Authentik forward-auth at the Ingress level.
