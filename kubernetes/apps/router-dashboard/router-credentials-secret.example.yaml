# Copy to kubernetes/apps/router-dashboard/router-credentials-secret.sops.yaml,
# fill in real values, then encrypt with:
#   SOPS_AGE_KEY_FILE=_local/age.key sops --encrypt --in-place \
#     kubernetes/apps/router-dashboard/router-credentials-secret.sops.yaml
apiVersion: v1
kind: Secret
metadata:
  name: router-credentials
  namespace: router-dashboard
type: Opaque
stringData:
  # Primary router: CRS309 (gateway, WireGuard, NAT)
  ROUTER_IP:   "10.10.1.2"
  ROUTER_USER: "network-dashboard"
  ROUTER_PASS: "CHANGE_ME_SET_FROM_MIKROTIK"
  WG_ENDPOINT: "isarcloud.eu"
  # Secondary router: CRS310 (switch — bridge/VLAN management)
  # Leave ROUTER_IP_2 empty to disable the second router in the UI.
  ROUTER_IP_2:   "10.10.1.3"
  ROUTER_USER_2: "network-dashboard"
  ROUTER_PASS_2: "CHANGE_ME_SET_FROM_MIKROTIK"
