server {
    listen 80;

    # Proxy API calls to the backend sidecar in the same Pod.
    # This means port 4000 never needs to be exposed via the Ingress or Service.
    location /api/ {
        proxy_pass         http://localhost:4000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Forward Authentik remote-user headers to the backend.
        proxy_set_header   X-authentik-username $http_x_authentik_username;
        proxy_set_header   X-authentik-email $http_x_authentik_email;
    }

    # Serve the React SPA; fall back to index.html for client-side routing.
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }
}
