apiVersion: apps/v1
kind: Deployment
metadata:
  name: router-dashboard
  namespace: router-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: router-dashboard
  template:
    metadata:
      labels:
        app: router-dashboard
    spec:
      containers:
        - name: backend
          image: ghcr.io/aaronschm/router-dashboard-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          env:
            - name: DATA_DIR
              value: /app/data
          envFrom:
            - secretRef:
                name: router-credentials
          volumeMounts:
            - name: data
              mountPath: /app/data
        - name: frontend
          image: ghcr.io/aaronschm/router-dashboard-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: router-dashboard-data
