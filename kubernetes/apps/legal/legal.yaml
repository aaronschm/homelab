apiVersion: v1
kind: Namespace
metadata:
  name: legal
---
# Static HTML served by nginx — privacy notice, ToS, face recognition consent,
# and data deletion request. Referenced from the Authentik enrollment flow.
apiVersion: v1
kind: ConfigMap
metadata:
  name: legal-pages
  namespace: legal
data:
  privacy.html: |
    <!DOCTYPE html>
    <html lang="de">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Datenschutzerklärung – IsarCloud</title>
      <style>
        :root { --accent: #3b82f6; }
        body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1.5rem; color: #1e293b; line-height: 1.7; }
        h1 { color: var(--accent); } h2 { margin-top: 2rem; border-bottom: 1px solid #e2e8f0; padding-bottom: .4rem; }
        .card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: .75rem; padding: 1.5rem; margin: 1rem 0; }
        .love { font-size: 1.1rem; background: #eff6ff; border-left: 4px solid var(--accent); padding: 1rem 1.5rem; border-radius: 0 .5rem .5rem 0; }
        footer { margin-top: 3rem; font-size: .85rem; color: #64748b; }
      </style>
    </head>
    <body>
      <h1>🔒 Datenschutz bei IsarCloud</h1>
      <div class="love">
        Deine Privatsphäre ist uns nicht nur eine gesetzliche Pflicht – sie liegt uns wirklich am Herzen.
        Wir sammeln nur, was wir brauchen. Wir teilen nichts. Wir respektieren dich.
      </div>

      <h2>1. Verantwortlicher</h2>
      <div class="card">
        <strong>Aaron Schmidt</strong><br>
        München, Bayern, Deutschland<br>
        Kontakt: <a href="mailto:privacy@isarcloud.eu">privacy@isarcloud.eu</a>
      </div>

      <h2>2. Welche Daten wir verarbeiten</h2>
      <p>Wir verarbeiten ausschließlich Daten, die du uns aktiv gibst:</p>
      <ul>
        <li><strong>Kontodaten:</strong> E-Mail-Adresse, Benutzername (für die Anmeldung)</li>
        <li><strong>Inhaltsdaten:</strong> Dateien, Fotos, Notizen und sonstige Daten, die du hochlädst</li>
        <li><strong>Technische Logs:</strong> Anonymisierte Verbindungsdaten (IP-Adressen werden <em>einseitig gehasht</em> – wir können sie nicht zurückverfolgen)</li>
        <li><strong>Messwerte:</strong> Aggregierte Systemmetriken (CPU, Speicher, Durchsatz) – kein Nutzerbezug</li>
      </ul>

      <h2>3. Gesichtserkennung (Immich)</h2>
      <div class="card" style="border-color: #fbbf24; background: #fffbeb;">
        <strong>⚠️ Besonderer Hinweis (Art. 9 DSGVO – biometrische Daten)</strong><br>
        Immich kann Gesichter in Fotos erkennen und gruppieren. Diese Funktion ist
        <strong>standardmäßig deaktiviert</strong> und wird nur aktiviert, wenn du es im
        Onboarding ausdrücklich erlaubst. Du kannst diese Einwilligung jederzeit in den
        Immich-Einstellungen widerrufen.
      </div>

      <h2>4. Rechtsgrundlagen</h2>
      <ul>
        <li><strong>Vertragserfüllung (Art. 6 Abs. 1 lit. b DSGVO):</strong> Bereitstellung der Dienste</li>
        <li><strong>Einwilligung (Art. 6 Abs. 1 lit. a DSGVO):</strong> Gesichtserkennung, sofern aktiviert</li>
        <li><strong>Berechtigtes Interesse (Art. 6 Abs. 1 lit. f DSGVO):</strong> Anonymisierte Systemdiagnose</li>
      </ul>

      <h2>5. Speicherdauer</h2>
      <ul>
        <li>Kontodaten: bis zur Kontolöschung</li>
        <li>Inhaltsdaten: bis zur Kontolöschung oder expliziter Löschung durch dich</li>
        <li>Technische Logs: <strong>30 Tage</strong>, danach automatisch gelöscht</li>
      </ul>

      <h2>6. Weitergabe an Dritte</h2>
      <p>Deine Daten werden <strong>nicht</strong> an Dritte verkauft oder für Werbezwecke genutzt.</p>
      <p>Verschlüsselte Backups werden auf einem privaten Server eines Vertrauenspartners in Deutschland gespeichert
      (Auftragsverarbeitungsvertrag nach Art. 28 DSGVO liegt vor). Der Server befindet sich in der EU.</p>

      <h2>7. Deine Rechte</h2>
      <div class="card">
        Du hast jederzeit das Recht auf:<br>
        <strong>Auskunft • Berichtigung • Löschung • Einschränkung • Datenübertragbarkeit • Widerspruch</strong><br><br>
        Anfragen bitte an: <a href="mailto:privacy@isarcloud.eu">privacy@isarcloud.eu</a> –
        oder direkt über den <a href="/delete">Löschantrag-Button</a> auf deiner Profilseite.
      </div>

      <h2>8. Beschwerderecht</h2>
      <p>Du kannst dich beim Bayerischen Landesbeauftragten für den Datenschutz beschweren:
      <a href="https://www.datenschutz-bayern.de" target="_blank">www.datenschutz-bayern.de</a></p>

      <footer>Letzte Aktualisierung: August 2026 · IsarCloud läuft auf deinem eigenen Heimserver in München.</footer>
    </body>
    </html>

  terms.html: |
    <!DOCTYPE html>
    <html lang="de">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Nutzungsbedingungen & AVV – IsarCloud</title>
      <style>
        :root { --accent: #3b82f6; }
        body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1.5rem; color: #1e293b; line-height: 1.7; }
        h1 { color: var(--accent); } h2 { margin-top: 2rem; border-bottom: 1px solid #e2e8f0; padding-bottom: .4rem; }
        .card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: .75rem; padding: 1.5rem; margin: 1rem 0; }
        .warning { background: #fff7ed; border-left: 4px solid #f97316; padding: 1rem 1.5rem; border-radius: 0 .5rem .5rem 0; margin: 1rem 0; }
        footer { margin-top: 3rem; font-size: .85rem; color: #64748b; }
      </style>
    </head>
    <body>
      <h1>📋 Nutzungsbedingungen & Auftragsverarbeitungsvertrag</h1>

      <h2>1. Wer wir sind</h2>
      <p>IsarCloud ist ein privat betriebener Heimserver in München, bereitgestellt von Aaron Schmidt
      für Freunde und Familie – kostenlos, ohne kommerzielle Absicht.</p>

      <h2>2. Verfügbarkeit & Ausfallzeiten</h2>
      <div class="warning">
        <strong>🏠 Das ist ein Heimserver.</strong><br>
        Kein SLA, kein Rechenzentrum, keine garantierte Verfügbarkeit.
        Ausfälle können entstehen durch: Internetzugangsunterbrechungen (Telekom/ISP),
        Stromausfälle, Hardwaredefekte oder geplante Wartung.<br><br>
        <strong>Du hast das Recht, mich jederzeit zu kontaktieren</strong> –
        per E-Mail an <a href="mailto:support@isarcloud.eu">support@isarcloud.eu</a> oder Signal.
        Ich melde mich so schnell es mir möglich ist.<br><br>
        Wichtige Daten solltest du zusätzlich lokal sichern.
      </div>

      <h2>3. Erlaubte Nutzung</h2>
      <ul>
        <li>Persönliche Dateien, Fotos, Passwörter, Nachrichten für den privaten Gebrauch</li>
        <li>Keine illegalen Inhalte, kein Spam, kein Cryptocurrency-Mining</li>
        <li>Kein Teilen von Zugangsdaten mit Dritten</li>
      </ul>

      <h2>4. Auftragsverarbeitung (Art. 28 DSGVO)</h2>
      <div class="card">
        Soweit du den Dienst für eigene personenbezogene Daten Dritter nutzt
        (z. B. Fotos von anderen Personen), bist du nach Art. 28 DSGVO Verantwortlicher
        und ich handele als dein Auftragsverarbeiter. Es gilt:<br><br>
        <ul>
          <li>Ich verarbeite Daten nur nach deiner Weisung</li>
          <li>Alle Daten bleiben in Deutschland (Heimserver München + Backup-Server Deutschland)</li>
          <li>Ich ergreife technische und organisatorische Maßnahmen (Verschlüsselung at-rest und in-transit)</li>
          <li>Ich informiere dich unverzüglich über Datenpannen</li>
          <li>Du kannst jederzeit Auskunft über alle gespeicherten Daten verlangen</li>
        </ul>
        Mit der Registrierung stimmst du diesem Auftragsverarbeitungsvertrag zu.
      </div>

      <h2>5. Löschung</h2>
      <p>Du kannst dein Konto und alle zugehörigen Daten jederzeit löschen lassen –
      über den <a href="/legal/delete.html">Löschantrag</a> oder per E-Mail.
      Die Löschung erfolgt innerhalb von 30 Tagen.</p>

      <h2>6. Änderungen</h2>
      <p>Wesentliche Änderungen kündige ich mindestens 4 Wochen vorher per E-Mail an.</p>

      <footer>Stand: August 2026 · Fragen? <a href="mailto:privacy@isarcloud.eu">privacy@isarcloud.eu</a></footer>
    </body>
    </html>

  consent-face.html: |
    <!DOCTYPE html>
    <html lang="de">
    <head>
      <meta charset="UTF-8">
      <title>Einwilligung Gesichtserkennung – IsarCloud</title>
      <style>
        body { font-family: system-ui, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1.5rem; color: #1e293b; }
        h1 { color: #3b82f6; }
        .consent-box { border: 2px solid #3b82f6; border-radius: .75rem; padding: 1.5rem; background: #eff6ff; }
        button { background: #3b82f6; color: white; border: none; padding: .75rem 2rem; border-radius: .5rem; font-size: 1rem; cursor: pointer; margin: .5rem; }
        button.decline { background: #64748b; }
        .legal { font-size: .8rem; color: #64748b; margin-top: 1rem; }
      </style>
    </head>
    <body>
      <h1>📸 Gesichtserkennung aktivieren?</h1>
      <div class="consent-box">
        <p><strong>Was passiert, wenn du Ja sagst:</strong></p>
        <ul>
          <li>Immich analysiert deine Fotos lokal auf dem Server und erkennt Gesichter</li>
          <li>Du kannst Personen benennen und Fotos danach durchsuchen</li>
          <li>Diese Daten gelten als <strong>biometrische Daten (Art. 9 DSGVO)</strong></li>
          <li>Die Verarbeitung erfolgt ausschließlich auf deinem IsarCloud-Server in München</li>
          <li>Du kannst diese Einwilligung jederzeit in den Immich-Einstellungen widerrufen</li>
        </ul>
        <p class="legal">
          Rechtsgrundlage: Art. 6 Abs. 1 lit. a, Art. 9 Abs. 2 lit. a DSGVO (ausdrückliche Einwilligung)<br>
          Widerruf: Immich → Einstellungen → Machine Learning → Gesichtserkennung deaktivieren
        </p>
        <div style="margin-top:1.5rem">
          <button onclick="respond(true)">✅ Ja, Gesichtserkennung aktivieren</button>
          <button class="decline" onclick="respond(false)">Nein, nicht aktivieren</button>
        </div>
      </div>
      <script>
        function respond(consent) {
          // Signal consent back to the Authentik enrollment flow via URL param.
          // The Authentik flow reads this and sets a custom user attribute.
          const url = new URL(window.location.href);
          const next = url.searchParams.get('next') || '/';
          window.location.href = next + (next.includes('?') ? '&' : '?') + 'face_consent=' + consent;
        }
      </script>
    </body>
    </html>

  delete.html: |
    <!DOCTYPE html>
    <html lang="de">
    <head>
      <meta charset="UTF-8">
      <title>Datenlöschung beantragen – IsarCloud</title>
      <style>
        body { font-family: system-ui, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1.5rem; color: #1e293b; }
        h1 { color: #ef4444; }
        form { background: #fff5f5; border: 1px solid #fecaca; border-radius: .75rem; padding: 1.5rem; }
        input, textarea { width: 100%; padding: .5rem; border: 1px solid #d1d5db; border-radius: .375rem; margin: .5rem 0 1rem; box-sizing: border-box; }
        button { background: #ef4444; color: white; border: none; padding: .75rem 2rem; border-radius: .5rem; cursor: pointer; font-size: 1rem; }
        .note { font-size: .85rem; color: #64748b; margin-top: 1rem; }
      </style>
    </head>
    <body>
      <h1>🗑️ Datenlöschung beantragen</h1>
      <p>Du hast das Recht auf Löschung aller deiner gespeicherten Daten (Art. 17 DSGVO).</p>
      <form action="mailto:privacy@isarcloud.eu" method="get">
        <label><strong>Dein Benutzername:</strong><br>
          <input type="text" name="subject" placeholder="Löschantrag: IhrBenutzername" required>
        </label>
        <label><strong>Was soll gelöscht werden?</strong><br>
          <textarea name="body" rows="4" placeholder="Alle Daten / nur Fotos / nur Dateien / Konto und alles">Hiermit beantrage ich die vollständige Löschung meines IsarCloud-Kontos und aller damit verbundenen Daten.</textarea>
        </label>
        <button type="submit">📧 Löschantrag senden</button>
        <p class="note">Alternativ direkt per E-Mail an <a href="mailto:privacy@isarcloud.eu">privacy@isarcloud.eu</a>.<br>
        Bearbeitung innerhalb von 30 Tagen. Bestätigung per E-Mail.</p>
      </form>
    </body>
    </html>

  nginx.conf: |
    server {
        listen 80;
        root /usr/share/nginx/html;
        index privacy.html;
        location / { try_files $uri $uri.html $uri/ =404; }
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legal
  namespace: legal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: legal
  template:
    metadata:
      labels:
        app: legal
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: pages
              mountPath: /usr/share/nginx/html
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
      volumes:
        - name: pages
          configMap:
            name: legal-pages
            items:
              - key: privacy.html
                path: privacy.html
              - key: terms.html
                path: terms.html
              - key: consent-face.html
                path: consent-face.html
              - key: delete.html
                path: delete.html
        - name: nginx-conf
          configMap:
            name: legal-pages
            items:
              - key: nginx.conf
                path: nginx.conf
---
apiVersion: v1
kind: Service
metadata:
  name: legal
  namespace: legal
spec:
  ports:
    - port: 80
  selector:
    app: legal
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: legal
  namespace: legal
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Legal pages are public — NO Authentik forward-auth here.
spec:
  tls:
    - hosts:
        - legal.isarcloud.eu
      secretName: legal-tls
  rules:
    - host: legal.isarcloud.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: legal
                port:
                  number: 80
