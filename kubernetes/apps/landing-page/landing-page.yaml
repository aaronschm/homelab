apiVersion: v1
kind: Namespace
metadata:
  name: landing-page
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: isarcloud-landing
  namespace: landing-page
data:
  index.html: |
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>isarcloud.eu</title>
        <style>
          :root {
            color-scheme: dark;
            --bg: #0f172a;
            --card: rgba(15, 23, 42, 0.78);
            --accent: #38bdf8;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --border: rgba(148, 163, 184, 0.18);
          }
          * { box-sizing: border-box; }
          body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top, #111827 0%, var(--bg) 48%, #020617 100%);
            color: var(--text);
          }
          main {
            width: min(680px, calc(100vw - 2rem));
            padding: 2rem 2.25rem;
            border-radius: 18px;
            border: 1px solid var(--border);
            background: var(--card);
            backdrop-filter: blur(10px);
            box-shadow: 0 24px 80px rgba(15, 23, 42, 0.6);
          }
          h1 {
            margin: 0 0 0.8rem;
            font-size: clamp(2rem, 4vw, 3rem);
            letter-spacing: -0.06em;
          }
          p {
            margin: 0.65rem 0;
            line-height: 1.6;
            color: var(--muted);
          }
          .tag {
            display: inline-block;
            padding: 0.4rem 0.7rem;
            border-radius: 999px;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.35);
            color: var(--accent);
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
          }
        </style>
      </head>
      <body>
        <main>
          <div class="tag">Home Lab</div>
          <h1>isarcloud.eu</h1>
          <p>Welcome to the isarcloud homelab.</p>
          <p>This is a placeholder landing page while the rest of the services come online.</p>
          <p>Public routing is intentionally simple right now; internal services are served via the cluster ingress.</p>
        </main>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: isarcloud-landing
  namespace: landing-page
spec:
  replicas: 1
  selector:
    matchLabels:
      app: isarcloud-landing
  template:
    metadata:
      labels:
        app: isarcloud-landing
    spec:
      containers:
        - name: landing
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: web-root
              mountPath: /usr/share/nginx/html
      volumes:
        - name: web-root
          configMap:
            name: isarcloud-landing
---
apiVersion: v1
kind: Service
metadata:
  name: isarcloud-landing
  namespace: landing-page
spec:
  selector:
    app: isarcloud-landing
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: isarcloud-landing
  namespace: landing-page
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  tls:
    - hosts:
        - isarcloud.eu
        - www.isarcloud.eu
      secretName: isarcloud-landing-tls
  rules:
    - host: isarcloud.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: isarcloud-landing
                port:
                  number: 80
    - host: www.isarcloud.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: isarcloud-landing
                port:
                  number: 80
