apiVersion: v1
kind: Namespace
metadata:
  name: landing-page
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: isarcloud-landing
  namespace: landing-page
data:
  index.html: |
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>isarcloud services</title>
        <style>
          :root {
            color-scheme: dark;
            --bg: #060814;
            --card: rgba(15, 23, 42, 0.74);
            --accent: #22d3ee;
            --accent-strong: #38bdf8;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: rgba(148, 163, 184, 0.22);
            --shadow: rgba(2, 6, 23, 0.58);
          }
          * { box-sizing: border-box; }
          body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
              radial-gradient(circle at top left, rgba(34, 211, 238, 0.22), transparent 34rem),
              radial-gradient(circle at bottom right, rgba(99, 102, 241, 0.24), transparent 30rem),
              linear-gradient(145deg, var(--bg), #0f172a 54%, #020617);
            color: var(--text);
          }
          main {
            width: min(1180px, calc(100vw - 2rem));
            margin: 0 auto;
            padding: 4rem 0;
          }
          .hero {
            display: grid;
            gap: 1.2rem;
            margin-bottom: 2rem;
          }
          h1 {
            margin: 0;
            font-size: clamp(2.7rem, 7vw, 5.8rem);
            line-height: 0.95;
            letter-spacing: -0.06em;
          }
          h2 {
            margin: 0 0 0.35rem;
            font-size: 1.05rem;
          }
          p {
            max-width: 760px;
            margin: 0;
            line-height: 1.6;
            color: var(--muted);
          }
          .tag {
            width: fit-content;
            padding: 0.4rem 0.7rem;
            border-radius: 999px;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.35);
            color: var(--accent);
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
          }
          .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 1rem;
          }
          .card {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 0.95rem;
            align-items: center;
            min-height: 126px;
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: 24px;
            background: var(--card);
            color: inherit;
            text-decoration: none;
            box-shadow: 0 22px 70px var(--shadow);
            backdrop-filter: blur(14px);
            transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
          }
          .card:hover,
          .card:focus-visible {
            transform: translateY(-4px);
            border-color: rgba(34, 211, 238, 0.72);
            background: rgba(15, 23, 42, 0.88);
            outline: none;
          }
          .icon {
            display: grid;
            place-items: center;
            width: 3.4rem;
            height: 3.4rem;
            border-radius: 1.15rem;
            background: linear-gradient(135deg, rgba(34, 211, 238, 0.25), rgba(99, 102, 241, 0.32));
            border: 1px solid rgba(226, 232, 240, 0.12);
            font-size: 1.75rem;
          }
          .card p {
            font-size: 0.92rem;
          }
          .footer {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            align-items: center;
            margin-top: 1.35rem;
            color: var(--muted);
            font-size: 0.95rem;
          }
          .button {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.65rem 0.9rem;
            border: 1px solid rgba(34, 211, 238, 0.42);
            border-radius: 999px;
            color: var(--text);
            text-decoration: none;
            background: rgba(34, 211, 238, 0.10);
          }
          .button:hover,
          .button:focus-visible {
            border-color: var(--accent-strong);
            outline: none;
          }
        </style>
      </head>
      <body>
        <main>
          <section class="hero" aria-labelledby="title">
            <div class="tag">isarcloud.eu</div>
            <h1 id="title">Pick a service</h1>
            <p>Welcome to the isarcloud homelab. Public apps are listed here; sensitive services stay behind Authentik.</p>
          </section>
          <section class="grid" aria-label="Public services">
            <a class="card" href="https://files.isarcloud.eu/">
              <span class="icon" aria-hidden="true">F</span>
              <span>
                <h2>Files</h2>
                <p>Open ownCloud for file sync, sharing, and storage.</p>
              </span>
            </a>
            <a class="card" href="https://media.isarcloud.eu/">
              <span class="icon" aria-hidden="true">M</span>
              <span>
                <h2>Media</h2>
                <p>Jump into the public media service.</p>
              </span>
            </a>
            <a class="card" href="https://jellyfin.isarcloud.eu/">
              <span class="icon" aria-hidden="true">J</span>
              <span>
                <h2>Jellyfin</h2>
                <p>Stream movies, shows, and music from the library.</p>
              </span>
            </a>
            <a class="card" href="https://legal.isarcloud.eu/">
              <span class="icon" aria-hidden="true">L</span>
              <span>
                <h2>Legal</h2>
                <p>Open the document and contract management app.</p>
              </span>
            </a>
          </section>
          <div class="footer">
            <a class="button" href="/internal.html">Show internal services</a>
            <span>Internal links require an Authentik login.</span>
          </div>
        </main>
      </body>
    </html>
  internal.html: |
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>isarcloud internal services</title>
        <style>
          :root {
            color-scheme: dark;
            --bg: #050816;
            --card: rgba(15, 23, 42, 0.78);
            --accent: #a78bfa;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: rgba(167, 139, 250, 0.32);
          }
          * { box-sizing: border-box; }
          body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
              radial-gradient(circle at top, rgba(167, 139, 250, 0.23), transparent 32rem),
              linear-gradient(145deg, var(--bg), #111827);
            color: var(--text);
          }
          main {
            width: min(1050px, calc(100vw - 2rem));
            margin: 0 auto;
            padding: 4rem 0;
          }
          h1 {
            margin: 0 0 0.6rem;
            font-size: clamp(2.4rem, 6vw, 4.8rem);
            line-height: 0.95;
            letter-spacing: -0.06em;
          }
          p {
            margin: 0;
            color: var(--muted);
            line-height: 1.6;
          }
          .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
          }
          .card {
            display: block;
            padding: 1.2rem;
            min-height: 118px;
            border: 1px solid var(--border);
            border-radius: 22px;
            background: var(--card);
            color: inherit;
            text-decoration: none;
            box-shadow: 0 22px 70px rgba(2, 6, 23, 0.55);
            transition: transform 180ms ease, border-color 180ms ease;
          }
          .card:hover,
          .card:focus-visible {
            transform: translateY(-4px);
            border-color: var(--accent);
            outline: none;
          }
          .card strong {
            display: block;
            margin-bottom: 0.45rem;
            font-size: 1.12rem;
          }
          .back {
            display: inline-flex;
            margin-top: 1.35rem;
            color: var(--text);
            text-decoration: none;
          }
        </style>
      </head>
      <body>
        <main>
          <h1>Internal services</h1>
          <p>These links are intentionally protected by Authentik and should only be visible after login.</p>
          <section class="grid" aria-label="Internal services">
            <a class="card" href="https://network.isarcloud.eu/"><strong>Network</strong><span>Router dashboard and network status.</span></a>
            <a class="card" href="https://metrics.isarcloud.eu/"><strong>Metrics</strong><span>Grafana dashboards and monitoring.</span></a>
            <a class="card" href="https://dns.isarcloud.eu/"><strong>DNS</strong><span>AdGuard Home management.</span></a>
            <a class="card" href="https://argocd.isarcloud.eu/"><strong>Argo CD</strong><span>GitOps deployment control plane.</span></a>
          </section>
          <a class="back" href="/">Back to public services</a>
        </main>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: isarcloud-landing
  namespace: landing-page
spec:
  replicas: 1
  selector:
    matchLabels:
      app: isarcloud-landing
  template:
    metadata:
      labels:
        app: isarcloud-landing
    spec:
      containers:
        - name: landing
          image: nginx:alpine
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: web-root
              mountPath: /usr/share/nginx/html
      volumes:
        - name: web-root
          configMap:
            name: isarcloud-landing
---
apiVersion: v1
kind: Service
metadata:
  name: isarcloud-landing
  namespace: landing-page
spec:
  selector:
    app: isarcloud-landing
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: isarcloud-landing
  namespace: landing-page
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - isarcloud.eu
        - www.isarcloud.eu
      secretName: isarcloud-landing-tls
  rules:
    - host: isarcloud.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: isarcloud-landing
                port:
                  number: 80
    - host: www.isarcloud.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: isarcloud-landing
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: isarcloud-landing-internal
  namespace: landing-page
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: authentik-forward-auth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - isarcloud.eu
        - www.isarcloud.eu
      secretName: isarcloud-landing-tls
  rules:
    - host: isarcloud.eu
      http:
        paths:
          - path: /internal.html
            pathType: Exact
            backend:
              service:
                name: isarcloud-landing
                port:
                  number: 80
    - host: www.isarcloud.eu
      http:
        paths:
          - path: /internal.html
            pathType: Exact
            backend:
              service:
                name: isarcloud-landing
                port:
                  number: 80
