apiVersion: v1
kind: Namespace
metadata:
  name: pelican
---
# Non-secret panel settings. The Pelican Panel is the web UI / control plane for
# game servers; the actual game containers run on the Wings VM (24020) provisioned
# by Terraform. The panel uses the in-cluster PostgreSQL for its database.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pelican-panel-config
  namespace: pelican
data:
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_ENVIRONMENT_ONLY: "false"
  APP_URL: "https://panel.homelab.lan"
  TRUSTED_PROXIES: "*"
  DB_CONNECTION: "pgsql"
  DB_HOST: "postgresql.postgresql.svc"
  DB_PORT: "5432"
  DB_DATABASE: "pelican"
  DB_USERNAME: "pelican"
  CACHE_STORE: "database"
  QUEUE_CONNECTION: "database"
  SESSION_DRIVER: "database"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pelican-panel-data
  namespace: pelican
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn-encrypted
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pelican-panel
  namespace: pelican
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pelican-panel
  template:
    metadata:
      labels:
        app: pelican-panel
    spec:
      containers:
        - name: panel
          image: ghcr.io/pelican-dev/panel:v1.0.0-beta19
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: pelican-panel-config
            - secretRef:
                name: pelican-panel-secret
          volumeMounts:
            - name: data
              mountPath: /pelican-data
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pelican-panel-data
---
apiVersion: v1
kind: Service
metadata:
  name: pelican-panel
  namespace: pelican
spec:
  selector:
    app: pelican-panel
  ports:
    - name: http
      port: 80
      targetPort: 80
