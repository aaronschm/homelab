# Copy to pelican-panel-secret.yaml (git-ignored), fill in real values, then
# `make secrets` applies it (or seal it with kubeseal for GitOps).
#
# Generate APP_KEY with:  echo "base64:$(openssl rand -base64 32)"
# DB_PASSWORD must match the pelican entry in the PostgreSQL APP_DATABASES secret.
apiVersion: v1
kind: Secret
metadata:
  name: pelican-panel-secret
  namespace: pelican
type: Opaque
stringData:
  APP_KEY: "base64:CHANGE_ME_GENERATE_A_REAL_KEY"
  DB_PASSWORD: "change-me-then-rotate"
