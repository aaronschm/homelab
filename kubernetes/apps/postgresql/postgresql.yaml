apiVersion: v1
kind: Namespace
metadata:
  name: postgresql
---
# Per-app database and role definitions. PostgreSQL's docker-entrypoint runs
# scripts in /docker-entrypoint-initdb.d/ on first start (empty PGDATA). On
# subsequent starts the script is a no-op because of the IF NOT EXISTS guards.
# To re-run after the cluster is already initialized, exec into the pod:
#   kubectl exec -n postgresql postgresql-0 -- bash /docker-entrypoint-initdb.d/init-app-databases.sh
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-init-databases
  namespace: postgresql
data:
  init-app-databases.sh: |
    #!/bin/bash
    set -e

    # Each APP_DATABASES entry is "role:password". The role name doubles as the
    # database name (e.g. "pelican:s3cur3" → role pelican, database pelican).
    for entry in $APP_DATABASES; do
      db_name="${entry%%:*}"
      db_pass="${entry#*:}"
      echo "ensuring role + database '$db_name'..."
      psql -v ON_ERROR_STOP=0 -U "$POSTGRES_USER" -d "$POSTGRES_DB" <<-EOSQL
        DO \$\$
        BEGIN
          IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '$db_name') THEN
            CREATE ROLE $db_name LOGIN PASSWORD '$db_pass';
          ELSE
            ALTER ROLE $db_name PASSWORD '$db_pass';
          END IF;
        END
        \$\$;
        SELECT 'CREATE DATABASE $db_name OWNER $db_name'
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '$db_name')\gexec
    EOSQL
    done

    echo "all application databases ready"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: postgresql
spec:
  serviceName: postgresql
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
        - name: postgresql
          image: postgres:17.2
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: APP_DATABASES
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: APP_DATABASES
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: init-script
          configMap:
            name: postgresql-init-databases
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # Longhorn (encrypted) is the default StorageClass (1 replica on the
        # single worker); scheduled backups ship this volume off-site via MinIO.
        storageClassName: longhorn-encrypted
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: postgresql
spec:
  selector:
    app: postgresql
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  clusterIP: None
