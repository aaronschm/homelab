# Copy to postgresql-secret.yaml (git-ignored) and fill in real values, OR
# manage it as a Sealed Secret. `make secrets` applies it.
#
# POSTGRES_USER / POSTGRES_PASSWORD: superuser credentials (admin only).
# POSTGRES_DB: the default database created on first init (admin use).
# APP_DATABASES: space-separated "role:password" pairs. Each role gets a
#   same-named database it owns. Add new services here — the init script
#   idempotently creates them on first start (or re-run manually, see
#   postgresql.yaml comments).
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-credentials
  namespace: postgresql
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: change-me-then-rotate
  POSTGRES_DB: postgres
  APP_DATABASES: "pelican:change-me-pelican-password"
