# Copy to postgresql-secret.yaml (git-ignored) and fill in real values, OR
# manage it as a Sealed Secret. `make secrets` copies the *.example.yaml
# templates; apply with `kubectl apply -f postgresql-secret.yaml`.
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-credentials
  namespace: postgresql
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: change-me-then-rotate
  POSTGRES_DB: app
