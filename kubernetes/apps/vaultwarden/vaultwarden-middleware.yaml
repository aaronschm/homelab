apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  # Named "headers" so the Ingress annotation "vaultwarden-headers@kubernetescrd"
  # resolves correctly: Traefik parses that as namespace=vaultwarden + name=headers
  name: headers
  namespace: vaultwarden
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: https
