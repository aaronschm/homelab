apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cmd-params-cm
    app.kubernetes.io/part-of: argocd
data:
  # Run the ArgoCD API server in HTTP mode.
  # TLS is terminated by the edge Traefik proxy which forwards plain HTTP
  # to the cluster. Without this, ArgoCD redirects HTTP→HTTPS → redirect loop.
  server.insecure: "true"
