# Longhorn -> MinIO backup credentials. THIS .example IS A TEMPLATE — Argo CD
# ignores *.example.yaml. Deploy the real secret the same way as MinIO's (seal it
# for GitOps, or copy to longhorn-backup-secret.yaml and `make secrets`).
#
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY must match the MinIO credentials (use
# the root user, or create a dedicated MinIO user scoped to longhorn-backups).
# AWS_ENDPOINTS points at the in-cluster MinIO Service.
apiVersion: v1
kind: Secret
metadata:
  name: longhorn-backup-credentials
  namespace: longhorn-system
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "minioadmin"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME_use_a_long_random_password"
  AWS_ENDPOINTS: "http://minio.minio.svc:9000"
