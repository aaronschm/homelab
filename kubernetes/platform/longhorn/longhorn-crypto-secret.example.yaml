# THE master encryption passphrase for all Longhorn volumes. THIS .example IS A
# TEMPLATE — Argo CD ignores *.example.yaml. Deploy the real secret via
# `make secrets` (copy to longhorn-crypto-secret.yaml, edit) or seal it.
#
# *** THIS IS THE SINGLE MOST IMPORTANT SECRET TO BACK UP OFF-SITE. ***
# Without CRYPTO_KEY_VALUE, every encrypted backup is permanently unreadable —
# including yours, after a total loss. Store it in your password manager AND on
# paper/offline, NOT only in this cluster. See the Recovery tab in guide.html.
#
# Generate a strong value:  openssl rand -base64 48
apiVersion: v1
kind: Secret
metadata:
  name: longhorn-crypto
  namespace: longhorn-system
type: Opaque
stringData:
  CRYPTO_KEY_VALUE: "CHANGE_ME_long_random_passphrase_back_this_up_offline"
  CRYPTO_KEY_PROVIDER: "secret"
  CRYPTO_KEY_CIPHER: "aes-xts-plain64"
  CRYPTO_KEY_HASH: "sha256"
  CRYPTO_KEY_SIZE: "256"
  CRYPTO_PBKDF: "argon2i"
