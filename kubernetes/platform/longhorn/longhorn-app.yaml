# Longhorn — the cluster's DEFAULT StorageClass, installed via rendered Helm manifests.
# Volumes live on the beta SSD at /var/mnt/longhorn (mounted by Talos). Single
# worker => 1 replica. Backups go to MinIO (s3://longhorn-backups) on a schedule
# (see backup-recurringjob.yaml); replicate that bucket off-site for an off-host copy.
#
# To update Longhorn: helm pull longhorn/longhorn --version X.Y.Z
# Then: helm template longhorn longhorn-X.Y.Z.tgz --namespace longhorn-system \
#   --set defaultSettings.defaultDataPath=/var/mnt/longhorn \
#   --set defaultSettings.defaultReplicaCount=1 \
#   > kubernetes/platform/longhorn/rendered/longhorn-rendered.yaml
#
# Requires the Talos schematic with iscsi-tools + util-linux-tools (already set
# in terraform.tfvars.example).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: http://10.10.20.100:3000/aaron/homelab.git
    targetRevision: main
    path: kubernetes/platform/longhorn/rendered
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
