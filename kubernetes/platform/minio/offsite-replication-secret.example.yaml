# Connection details for your friend's MinIO (the off-site backup target).
# THIS .example IS A TEMPLATE — Argo CD ignores *.example.yaml. Deploy the real
# secret via `make secrets` (copy to offsite-replication-secret.yaml, edit) or
# seal it.
#
# Your friend creates a dedicated MinIO user scoped to ONE bucket for you and
# gives you its access/secret key + his public endpoint. Because Longhorn already
# encrypts the data, he cannot read it even though he owns the server.
#
# Until your friend's MinIO exists, this can stay absent — the CronJob will just
# error and retry (harmless). Add it when ready.
apiVersion: v1
kind: Secret
metadata:
  name: offsite-replication
  namespace: minio
type: Opaque
stringData:
  OFFSITE_ENDPOINT: "https://minio.friend.example.net"
  OFFSITE_ACCESS_KEY: "CHANGE_ME_friend_provided_access_key"
  OFFSITE_SECRET_KEY: "CHANGE_ME_friend_provided_secret_key"
  OFFSITE_BUCKET: "aaron-longhorn-backups"
