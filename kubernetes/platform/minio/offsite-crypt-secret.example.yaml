# Client-side encryption key for the MinIO app-data off-site backup
# (minio-appdata-offsite-cronjob.yaml). rclone crypt encrypts file contents AND
# names with this passphrase before uploading to your friend's MinIO.
#
# THIS .example IS A TEMPLATE — Argo CD ignores *.example.yaml. Copy to
# offsite-crypt-secret.yaml, fill in, and `make secrets` applies it.
#
# *** ESCROW THIS PASSPHRASE (Bitwarden). *** Like longhorn-crypto, losing it
# makes the off-site app-data backup permanently unreadable — by you too. It is
# independent from longhorn-crypto; back up BOTH.
#
# Generate strong values:  openssl rand -base64 48   (run twice)
apiVersion: v1
kind: Secret
metadata:
  name: offsite-crypt
  namespace: minio
type: Opaque
stringData:
  RCLONE_CRYPT_PASSWORD: "CHANGE_ME_long_random_passphrase_escrow_in_bitwarden"
  # Optional but recommended second key (salt). Leave empty to skip.
  RCLONE_CRYPT_SALT: "CHANGE_ME_second_random_value_or_leave_blank"
  # Bucket your friend created for your encrypted app data (separate from the
  # longhorn-backups bucket). His scoped user needs read/write on it.
  OFFSITE_APPDATA_BUCKET: "aaron-appdata-backups"
  # Space-separated buckets to NOT replicate off-site. Jellyfin media is
  # re-acquirable; longhorn-backups is already replicated + LUKS-encrypted.
  EXCLUDE_BUCKETS: "jellyfin longhorn-backups"
