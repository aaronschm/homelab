# Distributed MinIO on 6×18TB drives passed through to the worker VM.
# Drives appear as /dev/sdd…/dev/sdi in the VM (scsi3…scsi8); Talos mounts
# them at /var/mnt/minio1…6 (see infrastructure/terraform/talos/variables.tf).
#
# Single-server 6-drive erasure coding: MinIO uses EC:3 (3 data + 3 parity) by
# default on 6 drives → 54 TB usable from 108 TB raw. Update MINIO_VOLUMES if
# you change the number of drives.
#
# Data migration from the old alpha pool:
#   1. Keep minio-data PVC alive until all buckets are rsynced.
#   2. Use `mc mirror minio-alpha/bucket minio-gamma/bucket` to copy each bucket.
#   3. Update app configs to point to the gamma endpoint, then delete the PVC.
apiVersion: v1
kind: Namespace
metadata:
  name: minio
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: minio
  labels:
    app: minio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      # Schedule exclusively on the worker node that owns the passthrough drives.
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-04-08T15-41-24Z
          args:
            - server
            - /var/mnt/minio1
            - /var/mnt/minio2
            - /var/mnt/minio3
            - /var/mnt/minio4
            - /var/mnt/minio5
            - /var/mnt/minio6
            - --console-address
            - ":9001"
          envFrom:
            - secretRef:
                name: minio-root
          env:
            # EC:2 parity — 4 data + 2 parity across 6 drives.
            # Gives ~72 TB usable from 108 TB raw and survives any 2 simultaneous
            # drive failures. Works well here because data is also backed up
            # off-site to the friend's MinIO server.
            - name: MINIO_STORAGE_CLASS_STANDARD
              value: "EC:2"
            - name: MINIO_STORAGE_CLASS_RRS
              value: "EC:1"
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: minio-drive-1
              mountPath: /var/mnt/minio1
            - name: minio-drive-2
              mountPath: /var/mnt/minio2
            - name: minio-drive-3
              mountPath: /var/mnt/minio3
            - name: minio-drive-4
              mountPath: /var/mnt/minio4
            - name: minio-drive-5
              mountPath: /var/mnt/minio5
            - name: minio-drive-6
              mountPath: /var/mnt/minio6
      volumes:
        - name: minio-drive-1
          hostPath:
            path: /var/mnt/minio1
            type: Directory
        - name: minio-drive-2
          hostPath:
            path: /var/mnt/minio2
            type: Directory
        - name: minio-drive-3
          hostPath:
            path: /var/mnt/minio3
            type: Directory
        - name: minio-drive-4
          hostPath:
            path: /var/mnt/minio4
            type: Directory
        - name: minio-drive-5
          hostPath:
            path: /var/mnt/minio5
            type: Directory
        - name: minio-drive-6
          hostPath:
            path: /var/mnt/minio6
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: minio
  labels:
    app: minio
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console
