# MinIO root credentials. THIS .example IS A TEMPLATE — Argo CD ignores
# *.example.yaml (see kubernetes/bootstrap/apps/platform.yaml exclude).
#
# To deploy the REAL secret, choose ONE:
#   A) GitOps-native (recommended): seal it so the encrypted copy is safe in Git
#        cp minio-secret.example.yaml minio-secret.yaml   # edit the password
#        kubeseal -f minio-secret.yaml -o yaml > sealed-minio-secret.yaml
#        # commit sealed-minio-secret.yaml; Argo applies it, the controller decrypts
#   B) Manual: copy to minio-secret.yaml (git-ignored), edit, and `make secrets`
#
# Never commit the plaintext minio-secret.yaml — it is git-ignored.
apiVersion: v1
kind: Secret
metadata:
  name: minio-root
  namespace: minio
type: Opaque
stringData:
  MINIO_ROOT_USER: "minioadmin"
  MINIO_ROOT_PASSWORD: "CHANGE_ME_use_a_long_random_password"
