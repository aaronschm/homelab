# Argo CD repository credentials — ONLY needed if your Git repo is PRIVATE.
# THIS .example IS A TEMPLATE — Argo CD ignores *.example.yaml. Copy to
# repo-credentials-secret.yaml, fill in, and `make gitops` applies it before the
# root app (so Argo can clone the private repo). Public repo? Skip this entirely.
#
# Use a Forgejo personal access token with read access to this repository.
# Store the token in Bitwarden.
apiVersion: v1
kind: Secret
metadata:
  name: repo-homelab
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: git
  url: http://10.10.20.100:3000/aaron/homelab.git
  username: aaron
  password: CHANGE_ME_forgejo_personal_access_token
