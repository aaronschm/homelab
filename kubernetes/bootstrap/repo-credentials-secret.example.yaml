# Argo CD repository credentials — ONLY needed if your Git repo is PRIVATE.
# THIS .example IS A TEMPLATE — Argo CD ignores *.example.yaml. Copy to
# repo-credentials-secret.yaml, fill in, and `make gitops` applies it before the
# root app (so Argo can clone the private repo). Public repo? Skip this entirely.
#
# Use a GitHub fine-grained PAT scoped to this repo with **Contents: Read-only**
# (or a classic token with `repo`). Store the token in Bitwarden.
apiVersion: v1
kind: Secret
metadata:
  name: repo-homelab
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: git
  url: https://github.com/aaronschm/homelab.git
  username: aaronschm
  password: CHANGE_ME_github_personal_access_token
