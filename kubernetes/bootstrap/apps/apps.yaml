apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: http://10.10.20.100:3000/aaron/homelab.git
    targetRevision: main
    path: kubernetes/apps
    directory:
      recurse: true
      exclude: "{**/*.example.yaml,**/*.sops.yaml,**/kustomization.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
