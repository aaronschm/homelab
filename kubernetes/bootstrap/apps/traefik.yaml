apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 33.2.1
    helm:
      values: |
        deployment:
          replicas: 1
        providers:
          kubernetesCRD:
            enabled: true
          kubernetesIngress:
            enabled: true
        ports:
          web:
            port: 8000
            nodePort: 32080
          websecure:
            port: 8443
            nodePort: 32443
        service:
          type: NodePort
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
