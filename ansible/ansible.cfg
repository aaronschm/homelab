[defaults]
# Enable the community.sops vars plugin so any group_vars/all.sops.yaml is
# decrypted transparently at play time (requires SOPS_AGE_KEY_FILE in env).
vars_plugins_enabled = host_group_vars,community.sops.sops

# Reduce noise from Ansible collection deprecation warnings.
deprecation_warnings = false

# Accept new host keys automatically (first connect).
# The MikroTik network_cli connection ignores ansible_ssh_common_args,
# so this must be set here to avoid "Host is unknown" failures.
host_key_checking = false
