---
- name: Deploy Forgejo on LXC
  hosts: forgejo_lxc
  become: true
  gather_facts: true

  tasks:
    - name: Ensure Docker APT prerequisites are installed
      ansible.builtin.apt:
        name:
          - ca-certificates
          - gnupg
        state: present
        update_cache: true

    - name: Ensure Docker APT keyring directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Install Docker repository key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Configure Docker apt repository
      ansible.builtin.deb822_repository:
        name: docker
        types: [deb]
        uris: https://download.docker.com/linux/debian
        suites: ["{{ ansible_distribution_release }}"]
        components: [stable]
        architectures: [amd64]
        signed_by: /etc/apt/keyrings/docker.asc
        state: present

    - name: Install Docker engine packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Ensure Docker is enabled and running
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Create Forgejo directory
      ansible.builtin.file:
        path: /opt/forgejo
        state: directory
        mode: "0755"

    - name: Create docker-compose.yml for Forgejo
      ansible.builtin.copy:
        dest: /opt/forgejo/docker-compose.yml
        content: |
          version: '3'

          networks:
            forgejo:
              external: false

          services:
            server:
              image: codeberg.org/forgejo/forgejo:1.22
              container_name: forgejo
              environment:
                - USER_UID=1000
                - USER_GID=1000
                - FORGEJO__actions__ENABLED=true
              restart: always
              networks:
                - forgejo
              volumes:
                - ./data:/data
                - /etc/timezone:/etc/timezone:ro
                - /etc/localtime:/etc/localtime:ro
              ports:
                - "3000:3000"
                - "2222:22"

            runner:
              image: code.forgejo.org/forgejo/runner:3.4.1
              container_name: forgejo-runner
              environment:
                - DOCKER_HOST=unix:///var/run/docker.sock
              networks:
                - forgejo
              volumes:
                - ./runner-data:/data
                - /var/run/docker.sock:/var/run/docker.sock
              restart: always
              profiles:
                - manual_start # Don't start automatically on first boot, needs registration
        mode: "0644"

    - name: Create runner registration helper script
      ansible.builtin.copy:
        dest: /opt/forgejo/register-runner.sh
        content: |
          #!/bin/bash
          echo "Please ensure you have completed the Forgejo setup wizard in the browser!"
          echo "Go to Site Administration -> Actions -> Runners -> Create new Runner"
          echo "Paste the Registration Token below:"
          read -p "Token: " TOKEN
          
          if [ -z "$TOKEN" ]; then
            echo "Token cannot be empty!"
            exit 1
          fi
          
          cd /opt/forgejo
          echo "Registering runner..."
          docker compose run --rm runner forgejo-runner register \
            --no-interactive \
            --token "$TOKEN" \
            --name "homelab-runner" \
            --instance http://server:3000
            
          echo "Starting the runner daemon in the background..."
          docker compose up -d runner
          
          echo "Done! Your CI/CD runner is active."
        mode: "0755"

    - name: Start Forgejo via Docker Compose
      ansible.builtin.command:
        cmd: docker compose -f /opt/forgejo/docker-compose.yml up -d server
      register: compose_up
      changed_when: "'Started' in compose_up.stderr or 'Created' in compose_up.stderr"
