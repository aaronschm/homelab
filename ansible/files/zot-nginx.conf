# Registry proxy: works around Zot v2.1.18 HEAD-request hang.
# Containerd sends HEAD /v2/<image>/manifests/<ref> to check digest before pull.
# Zot hangs on HEAD when no upstream is reachable (even for cached images).
# This proxy converts HEAD→GET for manifest paths; nginx strips the body
# automatically before returning to the HEAD client — OCI-spec compliant.

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    access_log /dev/stdout;

    # Remap HEAD→GET only for manifest lookups; pass everything else unchanged.
    map $request_method $proxy_method {
        HEAD    GET;
        default $request_method;
    }

    server {
        listen 5000;

        # OCI /v2/ base path and auth — pass through unchanged.
        location = /v2/ {
            proxy_pass http://zot:5001;
            proxy_set_header Host $host;
        }

        # Manifest endpoints: convert HEAD to GET so Zot serves from cache.
        location ~ ^/v2/.+/manifests/ {
            proxy_method         $proxy_method;
            proxy_pass           http://zot:5001;
            proxy_set_header     Host $host;
            # nginx returns only headers to HEAD clients regardless of backend body.
        }

        # Blobs, tags, and everything else: pass through as-is.
        location / {
            proxy_pass       http://zot:5001;
            proxy_set_header Host $host;
        }
    }
}
