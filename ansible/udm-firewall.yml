---
# Configure inter-VLAN firewall on a UDM Pro running UniFi Network 10.x
# (Zone-Based Firewall) via the internal v2 API.
#
# AUTH: this uses a local UniFi admin account (username/password) rather than an
# Integration API key. Reason: the Integration API (X-API-KEY) only exposes
# sites/devices/clients — it CANNOT create firewall policies. Firewall CRUD lives
# on the internal v2 API, which authenticates with a login session (cookie +
# CSRF token). Create a local-only admin in the UniFi UI (see ansible/README.md).
#
# Usage:
#   ansible-playbook -i inventory.ini udm-firewall.yml               # dry-run (show zones + policies)
#   ansible-playbook -i inventory.ini udm-firewall.yml -e udm_apply=true  # create missing policies
#
# Zone IDs are resolved automatically from the zone names defined in
# vars/firewall-rules.yml — no manual hex string copying needed.
#
# NOTE: this playbook manages FIREWALL POLICIES only. You still create the VLAN
# networks (10/20/24/25) in the UniFi UI first — see ansible/README.md.

- name: Configure UDM Pro Zone-Based Firewall
  hosts: udm
  gather_facts: false
  vars:
    udm_apply: false
    api_base: "{{ udm_host }}/proxy/network/v2/api/site/{{ udm_site }}"
  vars_files:
    - vars/firewall-rules.yml

  tasks:
    - name: Log in to the UniFi controller (local admin account)
      ansible.builtin.uri:
        url: "{{ udm_host }}/api/auth/login"
        method: POST
        body_format: json
        follow_redirects: all
        body:
          username: "{{ udm_username }}"
          password: "{{ udm_password }}"
        validate_certs: "{{ udm_verify_ssl }}"
        status_code: [200]
      register: login
      no_log: true

    - name: Capture session cookie + CSRF token
      ansible.builtin.set_fact:
        unifi_cookie: "{{ login.cookies_string }}"
        unifi_csrf: "{{ login.x_csrf_token | default(login.x_updated_csrf_token | default('')) }}"

    - name: Fetch firewall zones
      ansible.builtin.uri:
        url: "{{ api_base }}/firewall/zone"
        method: GET
        headers:
          Cookie: "{{ unifi_cookie }}"
          X-CSRF-Token: "{{ unifi_csrf }}"
          Accept: "application/json"
        validate_certs: "{{ udm_verify_ssl }}"
        status_code: [200]
      register: zones_raw

    - name: Fetch existing firewall policies
      ansible.builtin.uri:
        url: "{{ api_base }}/firewall-policies"
        method: GET
        headers:
          Cookie: "{{ unifi_cookie }}"
          X-CSRF-Token: "{{ unifi_csrf }}"
          Accept: "application/json"
        validate_certs: "{{ udm_verify_ssl }}"
        status_code: [200]
      register: policies

    # Build a name→id lookup dict from the zones API response.
    - name: Build zone name → ID map
      ansible.builtin.set_fact:
        zone_id_map: >-
          {{ dict(
               (zones_raw.json.data | default(zones_raw.json | default([])))
               | map(attribute='name')
               | zip(
                   (zones_raw.json.data | default(zones_raw.json | default([])))
                   | map(attribute='_id')
                 )
             ) }}

    - name: Show zone name → ID mapping
      ansible.builtin.debug:
        msg: "{{ zone_id_map }}"

    - name: Show existing policy names
      ansible.builtin.debug:
        msg: "{{ (policies.json.data | default(policies.json | default([]))) | map(attribute='name') | list }}"

    - name: Validate all referenced zone names exist on the controller
      ansible.builtin.assert:
        that:
          - zone_id_map[item] is defined
        fail_msg: >-
          Zone '{{ item }}' not found on the controller.
          Available zones: {{ zone_id_map.keys() | list }}.
          Fix zone_names in vars/firewall-rules.yml (case-sensitive).
        quiet: true
      loop: "{{ zone_names.values() | unique | list }}"
      loop_control:
        label: "{{ item }}"

    - name: Stop here unless apply mode is requested
      ansible.builtin.meta: end_play
      when: not (udm_apply | bool)

    # --- APPLY MODE -------------------------------------------------------
    # Body matches the schema discovered from UniFi Network 10.x ZBF API.
    # Required fields: ipVersion, schedule. Ports = comma-separated string.
    # Source IPs are needed because multiple VLANs share the Internal zone.
    - name: Create missing zone-based firewall policies
      ansible.builtin.uri:
        url: "{{ api_base }}/firewall-policies"
        method: POST
        headers:
          Cookie: "{{ unifi_cookie }}"
          X-CSRF-Token: "{{ unifi_csrf }}"
          Accept: "application/json"
        body_format: json
        body:
          name: "{{ item.name }}"
          enabled: true
          action: "ALLOW"
          protocol: "{{ item.proto | upper }}"
          ipVersion: "IPv4"
          schedule:
            mode: "ALWAYS"
          source:
            zone_id: "{{ zone_id_map[zone_names[item.src_zone]] }}"
            matching_target: "{{ 'IP' if item.src_ips | default([]) | length > 0 else 'ANY' }}"
            matching_target_type: "{{ 'SPECIFIC' if item.src_ips | default([]) | length > 0 else 'ANY' }}"
            ips: "{{ item.src_ips | default([]) }}"
          destination:
            zone_id: "{{ zone_id_map[zone_names[item.dst_zone]] }}"
            matching_target: "IP"
            matching_target_type: "SPECIFIC"
            ips: "{{ item.dst_ips | default([]) }}"
            port_matching_type: "SPECIFIC"
            port: "{{ item.ports | join(',') }}"
        validate_certs: "{{ udm_verify_ssl }}"
        status_code: [200, 201]
      loop: "{{ firewall_rules }}"
      loop_control:
        label: "{{ item.name }}"
      when: >-
        item.name not in
        (policies.json.data | default(policies.json | default([])) | map(attribute='name') | list)
