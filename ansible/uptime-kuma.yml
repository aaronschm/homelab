---
- name: Deploy Uptime Kuma on LXC
  hosts: uptimekuma_lxc
  become: true
  gather_facts: true

  tasks:
    - name: Ensure Docker APT prerequisites are installed
      ansible.builtin.apt:
        name:
          - ca-certificates
          - gnupg
        state: present
        update_cache: true

    - name: Ensure Docker APT keyring directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Install Docker repository key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Configure Docker apt repository
      ansible.builtin.deb822_repository:
        name: docker
        types: [deb]
        uris: https://download.docker.com/linux/debian
        suites: ["{{ ansible_distribution_release }}"]
        components: [stable]
        architectures: [amd64]
        signed_by: /etc/apt/keyrings/docker.asc
        state: present

    - name: Install Docker engine packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Ensure Docker is running
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Create Uptime Kuma directory
      ansible.builtin.file:
        path: /opt/uptime-kuma
        state: directory
        mode: "0755"

    - name: Create docker-compose.yml
      ansible.builtin.copy:
        dest: /opt/uptime-kuma/docker-compose.yml
        content: |
          version: '3.3'
          services:
            uptime-kuma:
              image: louislam/uptime-kuma:1
              container_name: uptime-kuma
              volumes:
                - ./data:/app/data
                - /var/run/docker.sock:/var/run/docker.sock:ro
              ports:
                - "3001:3001"
              restart: always
        mode: "0644"

    - name: Start Uptime Kuma
      ansible.builtin.command:
        cmd: docker compose -f /opt/uptime-kuma/docker-compose.yml up -d
      register: compose_up
      changed_when: "'Started' in compose_up.stderr or 'Created' in compose_up.stderr"
