---
- name: Deploy Uptime Kuma on LXC
  hosts: uptimekuma
  become: true
  gather_facts: true

  tasks:
    - name: Ensure curl is installed
      ansible.builtin.apt:
        name: curl
        state: present
        update_cache: true

    - name: Install Docker engine
      ansible.builtin.shell: |
        set -e
        if ! command -v docker >/dev/null 2>&1; then
          curl -fsSL https://get.docker.com | sh
        fi
      args:
        executable: /bin/bash
      changed_when: false

    - name: Ensure Docker is running
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Create Uptime Kuma directory
      ansible.builtin.file:
        path: /opt/uptime-kuma
        state: directory
        mode: "0755"

    - name: Create docker-compose.yml
      ansible.builtin.copy:
        dest: /opt/uptime-kuma/docker-compose.yml
        content: |
          version: '3.3'
          services:
            uptime-kuma:
              image: louislam/uptime-kuma:1
              container_name: uptime-kuma
              volumes:
                - ./data:/app/data
                - /var/run/docker.sock:/var/run/docker.sock:ro
              ports:
                - "3001:3001"
              restart: always
        mode: "0644"

    - name: Start Uptime Kuma
      ansible.builtin.command:
        cmd: docker compose -f /opt/uptime-kuma/docker-compose.yml up -d
      register: compose_up
      changed_when: "'Started' in compose_up.stderr or 'Created' in compose_up.stderr"
