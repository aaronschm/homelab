# Inter-VLAN firewall policies for the homelab.
# Updated from CRS309 export.

vlans:
  trusted: { id: 10, subnet: "10.10.10.0/24" }
  server:  { id: 20, subnet: "10.10.20.0/24" }
  dmz:     { id: 24, subnet: "10.10.24.0/24" }
  cluster: { id: 25, subnet: "10.10.25.0/24" }

firewall_rules:
  - name: "PC to Proxmox API"
    src_ips: ["10.10.10.0/24"]
    dst_ips: ["10.10.20.0/24"]
    ports: [8006]
    proto: tcp

  - name: "PC to Talos API"
    src_ips: ["10.10.10.0/24"]
    dst_ips: ["10.10.25.0/24"]
    ports: [50000]
    proto: tcp

  - name: "Server to Talos API"
    src_ips: ["10.10.20.0/24"]
    dst_ips: ["10.10.25.0/24"]
    ports: [50000]
    proto: tcp

  - name: "PC to Kubernetes API"
    src_ips: ["10.10.10.0/24"]
    dst_ips: ["10.10.25.11"]
    ports: [6443]
    proto: tcp

  - name: "Server to Kubernetes API"
    src_ips: ["10.10.20.0/24"]
    dst_ips: ["10.10.25.11"]
    ports: [6443]
    proto: tcp

  - name: "Server to Cluster ICMP"
    src_ips: ["10.10.20.0/24"]
    dst_ips: ["10.10.25.0/24"]
    proto: icmp

  - name: "Cluster to Proxmox NTP"
    src_ips: ["10.10.25.0/24"]
    dst_ips: ["10.10.20.2"]
    ports: [123]
    proto: udp

  - name: "Traefik to Cluster ingress"
    src_ips: ["10.10.24.10"]
    dst_ips: ["10.10.25.0/24"]
    ports: [80, 443]
    proto: tcp

  - name: "Traefik to Forgejo LXC"
    src_ips: ["10.10.24.10"]
    dst_ips: ["10.10.20.100"]
    ports: [3000]
    proto: tcp

nat_rules:
  - name: "RustDesk Relay TCP"
    proto: tcp
    ports: ["21115-21119"]
    to_ip: "10.10.25.101"
    to_ports: "31115-31119"
    
  - name: "RustDesk Relay UDP"
    proto: udp
    ports: ["21116"]
    to_ip: "10.10.25.101"
    to_ports: "31116"
    
  - name: "SimpleX Chat SMP"
    proto: tcp
    ports: ["5223"]
    to_ip: "10.10.25.101"
    to_ports: "32223"
