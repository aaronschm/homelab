[udm]
udmpro ansible_connection=local
# The UDM Pro is reached over its HTTPS API (uri module), not SSH.
# Set udm_host + udm_username/udm_password in group_vars/all.yml.

[proxmox]
pve ansible_host=10.10.20.2 ansible_user=root
# The Proxmox host on the Server VLAN.

[registry_lxc]
registry ansible_host=10.10.20.101 ansible_user=root ansible_ssh_common_args='-o ProxyJump=root@10.10.20.2 -o StrictHostKeyChecking=accept-new'
# The Registry LXC, configured to run Zot (registry-zot.yml).
# Reached via the Proxmox host (10.10.20.2) as SSH jump host since the
# workstation VLAN (10) has no direct route to the Server VLAN (20).

[traefik_lxc]
traefik ansible_host=10.10.24.10 ansible_user=root ansible_ssh_common_args='-o ProxyJump=root@10.10.20.2 -o StrictHostKeyChecking=accept-new'
# Reached via the Proxmox host (10.10.20.2) as SSH jump host just like the registry.

[adguard_lxc]
# DNS Server (VLAN 20)
adguard ansible_host=10.10.20.99 ansible_user=root ansible_ssh_common_args='-o ProxyJump=root@10.10.20.2 -o StrictHostKeyChecking=accept-new'

[forgejo_lxc]
# Forgejo Git Server (VLAN 20)
forgejo ansible_host=10.10.20.100 ansible_user=root ansible_ssh_common_args='-o ProxyJump=root@10.10.20.2 -o StrictHostKeyChecking=accept-new'

[lxc:children]
traefik_lxc
adguard_lxc
forgejo_lxc
registry_lxc
uptimekuma_lxc

[mikrotik]
crs309 ansible_host=10.10.1.2
crs310 ansible_host=10.10.1.3
# Update the ansible_host IPs to your actual MikroTik IP addresses.

[uptimekuma_lxc]
# Uptime Kuma LXC (VLAN 20)
uptimekuma ansible_host=10.10.20.102 ansible_user=root ansible_ssh_common_args='-o ProxyJump=root@10.10.20.2 -o StrictHostKeyChecking=accept-new'
