[udm]
udmpro ansible_connection=local
# The UDM Pro is reached over its HTTPS API (uri module), not SSH.
# Set udm_host + udm_username/udm_password in group_vars/all.yml.

[proxmox]
pve ansible_host=10.10.20.2 ansible_user=root
# The Proxmox host on the Server VLAN.

[registry]
registry ansible_host=10.10.20.101 ansible_user=root ansible_ssh_common_args='-o ProxyJump=root@10.10.20.2 -o StrictHostKeyChecking=no'
# The Registry LXC, configured to run Zot (registry-zot.yml).
# Reached via the Proxmox host (10.10.20.2) as SSH jump host since the
# workstation VLAN (10) has no direct route to the Server VLAN (20).

[traefik]
traefik ansible_host=10.10.24.10 ansible_user=root ansible_ssh_common_args='-o ProxyJump=root@10.10.20.2 -o StrictHostKeyChecking=no'
# Reached via the Proxmox host (10.10.20.2) as SSH jump host just like the registry

[adguard]
# IP .53 is a great mnemonic for DNS! (VLAN 20)
adguard ansible_host=10.10.20.53 ansible_user=root ansible_ssh_common_args='-o ProxyJump=root@10.10.20.2 -o StrictHostKeyChecking=no'

[forgejo]
# Forgejo Git Server (VLAN 20)
forgejo ansible_host=10.10.20.102 ansible_user=root ansible_ssh_common_args='-o ProxyJump=root@10.10.20.2 -o StrictHostKeyChecking=no'
