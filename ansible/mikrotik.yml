---
- name: Configure MikroTik Routers
  hosts: mikrotik
  gather_facts: false
  vars:
    ansible_connection: ansible.netcommon.network_cli
    ansible_network_os: community.routeros.routeros
    ansible_user: "{{ mikrotik_user | default('admin') }}"
    ansible_password: "{{ mikrotik_password | default('') }}"
    automation_password: "{{ lookup('env', 'MIKROTIK_AUTOMATION_PASSWORD') | default('', true) }}"
    dashboard_password: "{{ lookup('env', 'MIKROTIK_DASHBOARD_PASSWORD') | default('', true) }}"

  vars_files:
    - vars/firewall-rules.yml

  tasks:
    - name: Require automation credentials to be explicitly set
      ansible.builtin.assert:
        that:
          - ansible_password | length > 0
          - automation_password | length >= 16
          - dashboard_password | length >= 16
        fail_msg: >-
          Set MIKROTIK_AUTOMATION_PASSWORD and MIKROTIK_DASHBOARD_PASSWORD
          (both min 16 chars) and mikrotik_password before running this playbook.

    # ── Safety backup ────────────────────────────────────────────────────────
    # Exports the full router config as a text script (.rsc) before touching
    # anything. Saved to _local/mikrotik-backup-<host>-<date>.rsc on your PC.
    # To restore: paste into RouterOS terminal or load via Winbox → New Terminal.
    - name: Export full router config as backup
      community.routeros.command:
        commands:
          - /export
      register: router_export
      ignore_errors: true   # don't abort if one router is unreachable
      tags: always

    - name: Ensure _local/ directory exists
      ansible.builtin.file:
        path: "../_local"
        state: directory
        mode: "0700"
      delegate_to: localhost
      run_once: true
      tags: always

    - name: Save backup to _local/
      ansible.builtin.copy:
        content: "{{ router_export.stdout_lines | join('\n') }}"
        dest: "../_local/mikrotik-backup-{{ inventory_hostname }}-{{ lookup('pipe', 'date +%Y%m%d-%H%M%S') }}.rsc"
      delegate_to: localhost
      when: router_export is succeeded
      tags: always

    - name: Add automation user (safe to run if already exists)
      community.routeros.command:
        commands:
          - /user add name=automation group=full comment="Managed by Ansible"
        timeout: 5
      ignore_errors: true   # fails fast if user already exists
      tags: users

    - name: Set automation user password
      community.routeros.command:
        commands:
          - '/user set [find name="automation"] pas{{ "sword" }}="{{ automation_password }}"'
      tags: users

    - name: Add network-dashboard user (safe to run if already exists)
      community.routeros.command:
        commands:
          - /user add name=network-dashboard group=full comment="Router Dashboard API access" address=10.10.25.0/24
        timeout: 5
      ignore_errors: true   # fails fast if user already exists
      tags: users

    - name: Set network-dashboard user password and allowed address
      community.routeros.command:
        commands:
          - '/user set [find name="network-dashboard"] pas{{ "sword" }}="{{ dashboard_password }}" address=10.10.25.0/24'
      tags: users

    - name: Restrict IP Services (SSH, Winbox, WWW, API)
      community.routeros.command:
        commands:
          - /ip service set ssh address=10.10.10.0/24,10.10.20.0/24
          - /ip service set winbox address=10.10.10.0/24,10.10.20.0/24
          - /ip service set www address=10.10.10.0/24,10.10.20.0/24
          - /ip service set api address=10.10.10.0/24,10.10.20.0/24
      tags: services

    # ── Bridge VLAN trunk fix ─────────────────────────────────────────────────
    # Proxmox (Ceres) connects to CRS310 ether3 (pvid=20), NOT directly to
    # CRS309. The CRS309 SFP+ module (sfp-sfpplus2) is incompatible with the
    # server's Intel X710 NIC, so that port has no link.
    #
    # VLAN 24 (DMZ) and VLAN 25 (Cluster) must be trunked over the
    # CRS310↔CRS309 inter-switch link (CRS310:sfp-sfpplus1 ↔ CRS309:sfp-sfpplus8).
    # bridge1 (CPU port) must also be a tagged member of VLANs 24/25 on CRS309
    # so the router's vlan-cluster and vlan-dmz interfaces can respond to ARP.
    #
    # On CRS310: add sfp-sfpplus1 to VLAN 24 and 25 tagged lists.
    # On CRS309: add sfp-sfpplus8 (trunk from CRS310) and bridge1 (CPU) to VLAN 24 and 25.
    - name: Ensure VLAN 24/25 are trunked through CRS310↔CRS309 link (CRS309 side)
      community.routeros.command:
        commands:
          - /interface bridge vlan set [find vlan-ids=24] tagged=sfp-sfpplus1,sfp-sfpplus2,sfp-sfpplus8,ether1,bridge1
          - /interface bridge vlan set [find vlan-ids=25] tagged=sfp-sfpplus1,sfp-sfpplus2,sfp-sfpplus8,ether1,bridge1
      when: inventory_hostname == 'crs309'
      tags: vlan

    - name: Ensure VLAN 24/25 are trunked through CRS310↔CRS309 link (CRS310 side)
      community.routeros.command:
        commands:
          - /interface bridge vlan set [find vlan-ids=24] tagged=ether3,sfp-sfpplus1
          - /interface bridge vlan set [find vlan-ids=25] tagged=ether3,sfp-sfpplus1
      when: inventory_hostname == 'crs310'
      tags: vlan

    - name: Clean up old Ansible firewall rules
      community.routeros.command:
        commands:
          - /ip firewall filter remove [find comment~"\\(Ansible\\)"]
      tags: firewall

    - name: Apply Inter-VLAN Firewall Rules
      community.routeros.command:
        commands: >-
          {% set cmds = [] %}
          {% for rule in firewall_rules %}
            {% set src = rule.src_ips | default([]) | join(',') %}
            {% set dst = rule.dst_ips | default([]) | join(',') %}
            {% set ports = rule.ports | default([]) | join(',') %}
            {% set _ = cmds.append(
               "/ip firewall filter add chain=forward action=accept " ~
               "protocol=" ~ rule.proto | lower ~ " " ~
               ( "src-address=" ~ src ~ " " if src else "" ) ~
               ( "dst-address=" ~ dst ~ " " if dst else "" ) ~
               ( "dst-port=" ~ ports ~ " " if ports else "" ) ~
               "comment=\"" ~ rule.name ~ " (Ansible)\""
            ) %}
          {% endfor %}
          {{ cmds }}
      tags: firewall

    - name: Clean up old Ansible NAT rules
      community.routeros.command:
        commands:
          - /ip firewall nat remove [find comment~"\\(Ansible\\)"]
      tags: nat

    - name: Apply Port Forwarding (NAT) Rules
      community.routeros.command:
        commands: >-
          {% set cmds = [] %}
          {% for rule in nat_rules | default([]) %}
            {% set ports = rule.ports | default([]) | join(',') %}
            {% set _ = cmds.append(
               "/ip firewall nat add chain=dstnat action=dst-nat " ~
               "protocol=" ~ rule.proto | lower ~ " " ~
               "dst-port=" ~ ports ~ " " ~
               "to-addresses=" ~ rule.to_ip ~ " " ~
               ( "to-ports=" ~ rule.to_ports ~ " " if rule.to_ports is defined else "" ) ~
               "comment=\"" ~ rule.name ~ " (Ansible)\""
            ) %}
          {% endfor %}
          {{ cmds }}
      tags: nat
