# Copy to ansible/group_vars/all.sops.yaml, fill in real values, then run:
#   SOPS_AGE_KEY_FILE=_local/age.key sops --encrypt --in-place ansible/group_vars/all.sops.yaml
#
# The community.sops vars plugin (enabled in ansible.cfg) will decrypt this
# automatically at playbook runtime when SOPS_AGE_KEY_FILE is set.
#
# Fields matching the *.sops.yaml encrypted_regex in .sops.yaml are encrypted;
# the plaintext keys remain visible so Ansible can reference them normally.

# --- UniFi Dream Machine ---
udm_host: "https://10.10.20.1"     # UDM Pro IP on the mgmt VLAN
udm_site: "default"
udm_username: "homelab"
udm_password: "CHANGE_ME"          # local admin only, NOT Ubiquiti SSO

udm_verify_ssl: false              # UDM uses a self-signed cert by default
