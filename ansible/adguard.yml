---
- name: Install AdGuard Home DNS
  hosts: adguard_lxc
  become: yes
  vars:
    adguard_version: "v0.107.52"
    adguard_rewrite_target: "10.10.24.10"
    adguard_config_candidates:
      - /opt/adguardhome/conf/AdGuardHome.yaml
      - /opt/AdGuardHome/AdGuardHome.yaml
  tasks:
    - name: Download AdGuard Home
      unarchive:
        src: "https://github.com/AdguardTeam/AdGuardHome/releases/download/{{ adguard_version }}/AdGuardHome_linux_amd64.tar.gz"
        dest: /opt
        remote_src: yes
        creates: /opt/AdGuardHome/AdGuardHome

    - name: Install AdGuard Home as a service
      command: /opt/AdGuardHome/AdGuardHome -s install
      args:
        creates: /etc/systemd/system/AdGuardHome.service

    - name: Pre-seed AdGuard Home configuration (skips setup wizard)
      copy:
        dest: /opt/AdGuardHome/AdGuardHome.yaml
        force: no # Don't overwrite if it already exists
        content: |
          bind_host: 0.0.0.0
          bind_port: 3000
          users:
            # Default user: admin / admin (change this immediately in UI!)
            - name: admin
              password: "$2y$05$59S2d9m4oP/a5Gq7G/4hA.q.i2iA9jI2O2W.2U.7S8xZ1U1A3/1eG"
          dns:
            bind_hosts:
              - 0.0.0.0
            port: 53
            bootstrap_dns:
              - 1.1.1.1
            upstream_dns:
              - 1.1.1.1
              - 1.0.0.1
          tls:
            enabled: false
          filters:
            - enabled: true
              url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt
              name: AdGuard DNS filter
              id: 1
          user_rules:
            - "||*.isarcloud.eu^$dnsrewrite={{ adguard_rewrite_target }}"
            - "||isarcloud.eu^$dnsrewrite={{ adguard_rewrite_target }}"

    - name: Detect existing AdGuard config path
      stat:
        path: "{{ item }}"
      loop: "{{ adguard_config_candidates }}"
      register: adguard_config_stats

    - name: Select AdGuard config path
      set_fact:
        adguard_config_path: "{{ (adguard_config_stats.results | selectattr('stat.exists') | map(attribute='stat.path') | list | first) | default('') }}"

    - name: Update wildcard isarcloud rewrite target
      replace:
        path: "{{ adguard_config_path }}"
        regexp: "(domain: '\\*\\.isarcloud\\.eu'\\n\\s+answer:)\\s+\\S+"
        replace: "\\1 {{ adguard_rewrite_target }}"
      when: adguard_config_path | length > 0

    - name: Update apex isarcloud rewrite target
      replace:
        path: "{{ adguard_config_path }}"
        regexp: "(domain: isarcloud\\.eu\\n\\s+answer:)\\s+\\S+"
        replace: "\\1 {{ adguard_rewrite_target }}"
      when: adguard_config_path | length > 0

    - name: Ensure AdGuard is started and enabled
      systemd:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - adguardhome
        - AdGuardHome
      failed_when: false
