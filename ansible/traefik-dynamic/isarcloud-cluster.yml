# Routes for all *.isarcloud.eu services hosted in the K8s cluster.
# Edge Traefik terminates TLS (Let's Encrypt) then proxies plain HTTP
# to the cluster Traefik NodePort at 10.10.25.11:32080.
#
# PREREQUISITE: isarcloud.eu Cloudflare DNS records must be "DNS only"
# (grey cloud, not proxied) for ACME HTTP-01 to work.
# Alternatively configure dnsChallenge in traefik.yaml with CF API token.

http:
  routers:
    root:
      rule: "Host(`isarcloud.eu`) || Host(`www.isarcloud.eu`)"
      entryPoints: ["websecure"]
      service: cluster-proxy
      middlewares: ["cluster-forward-proto"]
      tls: { certResolver: "letsencrypt" }

    argocd:
      rule: "Host(`argocd.isarcloud.eu`)"
      entryPoints: ["websecure"]
      service: cluster-proxy
      middlewares: ["cluster-forward-proto"]
      tls: { certResolver: "letsencrypt" }

    auth:
      rule: "Host(`auth.isarcloud.eu`)"
      entryPoints: ["websecure"]
      service: cluster-proxy
      middlewares: ["cluster-forward-proto"]
      tls: { certResolver: "letsencrypt" }

    docs:
