      service: cluster-proxy
      middlewares: ["cluster-forward-proto"]
      tls: { certResolver: "letsencrypt" }

  middlewares:
    cluster-forward-proto:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: "https"

  services:
