http:
  routers:
    forgejo:
      rule: "Host(`git.isarcloud.eu`)"
      service: "forgejo-svc"
      priority: 100
      entryPoints: ["websecure"]
      tls:
        certResolver: letsencrypt
    # Break-glass native login endpoint.
    forgejo-native:
      rule: "Host(`git-native.isarcloud.eu`)"
      service: "forgejo-svc"
      priority: 100
      entryPoints: ["websecure"]
      tls:
        certResolver: letsencrypt
  services:
    forgejo-svc:
      loadBalancer:
        servers:
          # Pointing directly to the new Forgejo LXC on VLAN 20
          - url: "http://10.10.20.100:3000"
