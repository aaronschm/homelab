http:
  routers:
    forgejo:
      rule: "Host(`git.isarcloud.eu`)"
      service: "forgejo-svc"
      priority: 100
      entryPoints: ["websecure"]
      middlewares: ["authentik-forward-auth"]
      tls:
        certResolver: letsencrypt
    # Break-glass native login endpoint.
    forgejo-native:
      rule: "Host(`git-native.isarcloud.eu`)"
      service: "forgejo-svc"
      priority: 100
      entryPoints: ["websecure"]
      tls:
        certResolver: letsencrypt
  middlewares:
    authentik-forward-auth:
      forwardAuth:
        address: "http://10.10.20.54:9000/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
  services:
    forgejo-svc:
      loadBalancer:
        servers:
          # Pointing directly to the new Forgejo LXC on VLAN 20
          - url: "http://10.10.20.100:3000"
