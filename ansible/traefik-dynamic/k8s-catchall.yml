http:
  routers:
    k8s-http:
      # Catch anything for your domain that isn't handled by LXC (like Forgejo)
      rule: "HostRegexp(`^[a-zA-Z0-9-]+\\.aaronschmidt\\.de$`) || HostRegexp(`^[a-zA-Z0-9-]+\\.isarcloud\\.eu$`)"
      priority: 1
      service: "k8s-ingress-http"
      entryPoints: ["websecure"]
      tls:
        certResolver: letsencrypt

  services:
    k8s-ingress-http:
      loadBalancer:
        servers:
          # Pointing to Traefik NodePort on multiple Talos nodes for resilience.
          # Keep this list aligned with your active cluster node IPs.
          - url: "http://10.10.25.11:32080"
          - url: "http://10.10.25.101:32080"
