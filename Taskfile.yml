version: "3"

silent: true

vars:
  PROXMOX_DIR: infrastructure/terraform/proxmox
  TALOS_DIR: infrastructure/terraform/talos
  ANSIBLE_DIR: ansible
  KUBECONFIG_OUT: infrastructure/kubeconfig
  TALOSCONFIG_OUT: infrastructure/talosconfig
  AGE_KEY: _local/age.key
  ARGOCD_VERSION: stable

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list

  # ---------------------------------------------------------------- tooling ---
  setup:
    desc: Install the pinned toolchain via mise + Python SSH dependencies for Ansible
    cmds:
      - mise install
      - pip install --user --break-system-packages paramiko ansible-pylibssh
      - ansible-galaxy collection install -r ansible/requirements.yml
      - 'echo "Toolchain ready. Next: task secrets:init"'

  # ---------------------------------------------------------------- secrets ---
  secrets:init:
    desc: Generate your age keypair for SOPS
    status:
      - test -f {{.AGE_KEY}}
    cmds:
      - mkdir -p _local
      - age-keygen -o {{.AGE_KEY}}
      - 'echo ""'
      - 'echo "Add this PUBLIC key to .sops.yaml (age: field):"'
      - age-keygen -y {{.AGE_KEY}}

  vars:init:
    desc: "Create ansible/group_vars/all.sops.yaml from the example and encrypt it"
    preconditions:
      - sh: test -f {{.AGE_KEY}}
        msg: "Missing {{.AGE_KEY}}. Run: task secrets:init"
      - sh: command -v sops >/dev/null 2>&1
        msg: "Missing sops in PATH. Run: task setup"
    status:
      - test -f {{.ANSIBLE_DIR}}/group_vars/all.sops.yaml
    cmds:
      - cp {{.ANSIBLE_DIR}}/group_vars/all.sops.example.yaml {{.ANSIBLE_DIR}}/group_vars/all.sops.yaml
      - 'echo "Edit {{.ANSIBLE_DIR}}/group_vars/all.sops.yaml, then run:"'
      - 'echo "  SOPS_AGE_KEY_FILE={{.AGE_KEY}} sops --encrypt --in-place {{.ANSIBLE_DIR}}/group_vars/all.sops.yaml"'

  secrets:pubkey:
    desc: Print your age public key
    preconditions:
      - sh: test -f {{.AGE_KEY}}
        msg: "Missing {{.AGE_KEY}}. Run: task secrets:init"
    cmds:
      - age-keygen -y {{.AGE_KEY}}

  secrets:edit:
    desc: "Edit an encrypted secret in place, e.g. task secrets:edit -- path/to/file.sops.yaml"
    preconditions:
      - sh: test -f {{.AGE_KEY}}
        msg: "Missing {{.AGE_KEY}}. Run: task secrets:init"
    cmds:
      - SOPS_AGE_KEY_FILE={{.AGE_KEY}} sops {{.CLI_ARGS}}

  secrets:rekey:
    desc: Re-encrypt all *.sops.yaml files
    preconditions:
      - sh: test -f {{.AGE_KEY}}
        msg: "Missing {{.AGE_KEY}}. Run: task secrets:init"
    cmds:
      - 'SOPS_AGE_KEY_FILE={{.AGE_KEY}} find . -name "*.sops.yaml" -not -path "./_local/*" -exec sops updatekeys -y {} \;'

  # ------------------------------------------------------ infrastructure ---
  mikrotik:backup:
    desc: "Export full MikroTik config to _local/ (safe read-only — run before any changes)"
    dir: "{{.ANSIBLE_DIR}}"
    preconditions:
      - sh: test -f ../{{.AGE_KEY}}
        msg: "Missing {{.AGE_KEY}}. Run: task secrets:init"
    cmds:
      - SOPS_AGE_KEY_FILE=../{{.AGE_KEY}} ansible-playbook -i inventory.ini mikrotik.yml --tags always --skip-tags firewall,nat,services,users

  firewall:
    desc: "Stage 0 - Update MikroTik firewall rules"
    dir: "{{.ANSIBLE_DIR}}"
    preconditions:
      - sh: command -v ansible-playbook >/dev/null 2>&1
        msg: "Missing ansible-playbook in PATH."
      - sh: test -f ../{{.AGE_KEY}}
        msg: "Missing {{.AGE_KEY}}. Run: task secrets:init"
      - sh: test -n "$MIKROTIK_AUTOMATION_PASSWORD"
        msg: "Set MIKROTIK_AUTOMATION_PASSWORD env var before running (min 16 chars)"
      - sh: test -n "$MIKROTIK_DASHBOARD_PASSWORD"
        msg: "Set MIKROTIK_DASHBOARD_PASSWORD env var before running (min 16 chars)"
    cmds:
      - SOPS_AGE_KEY_FILE=../{{.AGE_KEY}} MIKROTIK_AUTOMATION_PASSWORD="$MIKROTIK_AUTOMATION_PASSWORD" MIKROTIK_DASHBOARD_PASSWORD="$MIKROTIK_DASHBOARD_PASSWORD" ansible-playbook -i inventory.ini mikrotik.yml

  infra:
    desc: "Stage 1 - Create LXCs + Talos VMs via Proxmox API"
    dir: "{{.PROXMOX_DIR}}"
    preconditions:
      - sh: command -v terraform >/dev/null 2>&1
        msg: "Missing terraform in PATH. Run: task setup"
    cmds:
      - terraform init -input=false
      - terraform apply -auto-approve

  cluster:
    desc: "Stage 2 - Apply Talos config, bootstrap etcd, write kubeconfig"
    dir: "{{.TALOS_DIR}}"
    preconditions:
      - sh: command -v terraform >/dev/null 2>&1
        msg: "Missing terraform in PATH. Run: task setup"
    cmds:
      - terraform init -input=false
      - terraform apply -auto-approve
      - terraform output -raw kubeconfig > ../../{{.KUBECONFIG_OUT}}
      - terraform output -raw talosconfig > ../../{{.TALOSCONFIG_OUT}}
      - 'echo "Wrote kubeconfig and talosconfig"'

  kubeconfig:
    desc: "Extract kubeconfig from terraform"
    dir: "{{.TALOS_DIR}}"
    preconditions:
      - sh: command -v terraform >/dev/null 2>&1
        msg: "Missing terraform in PATH. Run: task setup"
    cmds:
      - terraform output -raw kubeconfig > ../../{{.KUBECONFIG_OUT}}

  # ------------------------------------------------------- kubernetes ---
  gitops:
    desc: "Stage 3 - Install Argo CD and apply root app"
    preconditions:
      - sh: command -v kubectl >/dev/null 2>&1
        msg: "Missing kubectl in PATH."
      - sh: test -f {{.KUBECONFIG_OUT}}
        msg: "Missing {{.KUBECONFIG_OUT}}. Run: task cluster"
    cmds:
      - KUBECONFIG={{.KUBECONFIG_OUT}} kubectl create namespace argocd --dry-run=client -o yaml | KUBECONFIG={{.KUBECONFIG_OUT}} kubectl apply -f -
      - KUBECONFIG={{.KUBECONFIG_OUT}} kubectl apply -n argocd --server-side --force-conflicts -f https://raw.githubusercontent.com/argoproj/argo-cd/{{.ARGOCD_VERSION}}/manifests/install.yaml
      - KUBECONFIG={{.KUBECONFIG_OUT}} kubectl -n argocd rollout status deploy/argocd-server --timeout=300s
      - |
        if [ -f kubernetes/bootstrap/repo-credentials-secret.sops.yaml ]; then
          test -f {{.AGE_KEY}} || { echo "Missing {{.AGE_KEY}}. Run: task secrets:init"; exit 1; }
          echo "Applying private-repo credentials"
          SOPS_AGE_KEY_FILE={{.AGE_KEY}} sops --decrypt kubernetes/bootstrap/repo-credentials-secret.sops.yaml | KUBECONFIG={{.KUBECONFIG_OUT}} kubectl apply -f -
        fi
      - KUBECONFIG={{.KUBECONFIG_OUT}} kubectl apply -f kubernetes/bootstrap/root-app.yaml
      - 'echo "Argo CD installed and root app applied."'

  secrets:apply:
    desc: "Stage 4 - Decrypt and apply SOPS secrets to the cluster"
    preconditions:
      - sh: command -v kubectl >/dev/null 2>&1
        msg: "Missing kubectl in PATH."
      - sh: command -v sops >/dev/null 2>&1
        msg: "Missing sops in PATH. Run: task setup"
      - sh: test -f {{.KUBECONFIG_OUT}}
        msg: "Missing {{.KUBECONFIG_OUT}}. Run: task cluster"
      - sh: test -f {{.AGE_KEY}}
        msg: "Missing {{.AGE_KEY}}. Run: task secrets:init"
    cmds:
      - KUBECONFIG={{.KUBECONFIG_OUT}} kubectl create namespace minio --dry-run=client -o yaml | KUBECONFIG={{.KUBECONFIG_OUT}} kubectl apply -f -
      - KUBECONFIG={{.KUBECONFIG_OUT}} kubectl create namespace longhorn-system --dry-run=client -o yaml | KUBECONFIG={{.KUBECONFIG_OUT}} kubectl apply -f -
      - KUBECONFIG={{.KUBECONFIG_OUT}} kubectl create namespace postgresql --dry-run=client -o yaml | KUBECONFIG={{.KUBECONFIG_OUT}} kubectl apply -f -
      - KUBECONFIG={{.KUBECONFIG_OUT}} kubectl create namespace pelican --dry-run=client -o yaml | KUBECONFIG={{.KUBECONFIG_OUT}} kubectl apply -f -
      - KUBECONFIG={{.KUBECONFIG_OUT}} kubectl create namespace authentik --dry-run=client -o yaml | KUBECONFIG={{.KUBECONFIG_OUT}} kubectl apply -f -
      - KUBECONFIG={{.KUBECONFIG_OUT}} kubectl create namespace owncloud --dry-run=client -o yaml | KUBECONFIG={{.KUBECONFIG_OUT}} kubectl apply -f -
      - KUBECONFIG={{.KUBECONFIG_OUT}} kubectl create namespace immich --dry-run=client -o yaml | KUBECONFIG={{.KUBECONFIG_OUT}} kubectl apply -f -
      - KUBECONFIG={{.KUBECONFIG_OUT}} kubectl create namespace jellyfin --dry-run=client -o yaml | KUBECONFIG={{.KUBECONFIG_OUT}} kubectl apply -f -
      - KUBECONFIG={{.KUBECONFIG_OUT}} kubectl create namespace synapse --dry-run=client -o yaml | KUBECONFIG={{.KUBECONFIG_OUT}} kubectl apply -f -
      - KUBECONFIG={{.KUBECONFIG_OUT}} kubectl create namespace vaultwarden --dry-run=client -o yaml | KUBECONFIG={{.KUBECONFIG_OUT}} kubectl apply -f -
      - KUBECONFIG={{.KUBECONFIG_OUT}} kubectl create namespace paperless --dry-run=client -o yaml | KUBECONFIG={{.KUBECONFIG_OUT}} kubectl apply -f -
      - KUBECONFIG={{.KUBECONFIG_OUT}} kubectl create namespace grafana --dry-run=client -o yaml | KUBECONFIG={{.KUBECONFIG_OUT}} kubectl apply -f -
      - KUBECONFIG={{.KUBECONFIG_OUT}} kubectl create namespace router-dashboard --dry-run=client -o yaml | KUBECONFIG={{.KUBECONFIG_OUT}} kubectl apply -f -
      - KUBECONFIG={{.KUBECONFIG_OUT}} kubectl create namespace kube-system --dry-run=client -o yaml | KUBECONFIG={{.KUBECONFIG_OUT}} kubectl apply -f -
      - |
        find kubernetes -name "*-secret.sops.yaml" -print0 | while IFS= read -r -d '' f; do
          echo "Applying $f"
          SOPS_AGE_KEY_FILE={{.AGE_KEY}} sops --decrypt "$f" | KUBECONFIG={{.KUBECONFIG_OUT}} kubectl apply -f -
        done

  destroy:
    desc: "Tear everything down (talos first, then proxmox)"
    cmds:
      - terraform -chdir={{.TALOS_DIR}} destroy -auto-approve
      - terraform -chdir={{.PROXMOX_DIR}} destroy -auto-approve

  all:
    desc: "Full bring-up: firewall -> infra -> cluster -> gitops -> secrets"
    cmds:
      - task: firewall
      - task: infra
      - task: cluster
      - task: gitops
      - task: secrets:apply
